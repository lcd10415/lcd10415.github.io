<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>lcd10415 Apps</title>
  <meta name="description" content="Apps by lcd10415 — SimpleLedger and more." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #14222b;
      --muted: #5b7380;
      --line: #d7e4ea;
      --card: #ffffff;
      --bg: #f2f7f9;
      --accent: #1f9e8f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans SC", "Sora", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 0% 0%, rgba(31,158,143,.18), transparent 55%),
        radial-gradient(700px 360px at 100% 0%, rgba(20,100,140,.12), transparent 50%),
        var(--bg);
      line-height: 1.6;
    }
    .wrap { max-width: 880px; margin: 0 auto; padding: 56px 22px 80px; }
    h1 {
      font-family: Sora, "Noto Sans SC", sans-serif;
      font-size: clamp(28px, 5vw, 40px);
      letter-spacing: -0.03em;
      margin: 0 0 8px;
    }
    .sub { color: var(--muted); margin: 0 0 36px; }
    .apps { display: grid; gap: 16px; }
    a.app {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 16px;
      align-items: center;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px 18px;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    a.app:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(20,34,43,.08);
    }
    .icon {
      width: 56px; height: 56px; border-radius: 14px;
      object-fit: cover; background: #e8f4f2;
    }
    .icon.fallback {
      display: grid; place-items: center;
      font-family: Sora, sans-serif; font-weight: 700;
      color: #fff; background: linear-gradient(135deg, #38bdf8, #0284c7);
    }
    .name { font-weight: 700; font-size: 18px; margin: 0 0 4px; }
    .desc { margin: 0; color: var(--muted); font-size: 14px; }
    .go { color: var(--accent); font-weight: 700; font-size: 14px; }
    footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>lcd10415 Apps</h1>
    <p class="sub">产品站点入口 · Product sites</p>
    <div class="apps">
      <a class="app" href="/simpleledger/">
        <img class="icon" src="/simpleledger/assets/icon.png" alt="" width="56" height="56" />
        <div>
          <p class="name">简单记账 / SimpleLedger</p>
          <p class="desc">本地个人账本 · Private expense tracker for iPhone</p>
        </div>
        <span class="go">打开 →</span>
      </a>
      <a class="app" href="/lingomind/">
        <div class="icon fallback" aria-hidden="true">LM</div>
        <div>
          <p class="name">LingoMind</p>
          <p class="desc">See it. Recall it. Use it.</p>
        </div>
        <span class="go">打开 →</span>
      </a>
    </div>
    <footer>
      AdMob <a href="/app-ads.txt">app-ads.txt</a>
      · Contact <a href="mailto:lcd10415@163.com">lcd10415@163.com</a>
    </footer>
  </div>
</body>
</html>
